<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 程式練習介面</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_1002.css') }}">
</head>
<body>
    <div class="container">
        <h1>AI 程式練習助手</h1>
        <p>這是一個用於練習程式設計的 AI 助手。請選擇學習主題並點擊「幫我出題」按鈕來產生練習題。</p>
        
        <!-- 第一個表單：選擇學習主題並出題 -->
        <h3>請輸入選擇的學習主題: {{ topic }}</h3>
        <form method="post">
            <div class="topics">
                <label>
                    <input type="radio" name="topic" value="輸入輸出" {% if topic == "輸入輸出" %}checked{% endif %}> 輸入輸出
                </label>
                <label>
                    <input type="radio" name="topic" value="條件判斷" {% if topic == "條件判斷" %}checked{% endif %}> 條件判斷
                </label>
                <label>
                    <input type="radio" name="topic" value="迴圈" {% if topic == "迴圈" %}checked{% endif %}> 迴圈
                </label>
                <label>
                    <input type="radio" name="topic" value="串列" {% if topic == "串列" %}checked{% endif %}> 串列
                </label>
            </div>
            <!-- 加上 name="action" 與 value="generate" 讓後端知道要出題 -->
            <button type="submit" class="min-btn" name="action" value="generate">幫我出題</button>
        </form>

        <!-- AI 出題與作答區塊 -->
        <div class="question_ai">
            <h3>AI 出題:</h3>
            <p>{{ question_text }}</p>

            <!-- 只有當後端有傳入 question_data（AI 題目）時才顯示選項與提交按鈕 -->
            {% if question_data %}
            <form method="POST">
                <!-- 隱藏欄位，提交時保留目前的學習主題 -->
                <input type="hidden" name="topic" value="{{ topic }}">
                
                <!-- 顯示 Gemini AI 產生的四個選項內容 -->
                <label>
                    <input type="radio" name="student_answer" value="A"> A. {{ question_data["A"] }}
                </label>
                <label>
                    <input type="radio" name="student_answer" value="B"> B. {{ question_data["B"] }}
                </label>
                <label>
                    <input type="radio" name="student_answer" value="C"> C. {{ question_data["C"] }}
                </label>
                <label>
                    <input type="radio" name="student_answer" value="D"> D. {{ question_data["D"] }}
                </label>

                <!-- 提交答案按鈕 -->
                <button type="submit" class="min-btn" name="action" value="check">提交答案</button>
            </form>
            {% endif %}
        </div>

        <!-- 顯示 AI 回饋結果 -->
        <div class="feedback">
            <h3>AI 回饋:</h3>
            <p>{{ feedback }}</p>
        </div>
    </div>
</body>
</html>
